<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#E6007E', // Company Hero Pink
                            hover: '#C2006B',
                            dark: '#0F172A', 
                            light: '#F8FAFC',
                            slate: '#1E293B',
                            hero: '#FF008A'
                        }
                    },
                    boxShadow: {
                        'hero': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02)',
                        'glow': '0 0 20px rgba(230, 0, 126, 0.2)',
                        'glow-emerald': '0 0 20px rgba(16, 185, 129, 0.3)',
                        'floating': '0 12px 30px -10px rgba(0,0,0,0.1)'
                    },
                    animation: {
                        'bounce-subtle': 'bounce-subtle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        'bounce-subtle': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { background-color: #F8FAFC; }
        .dark body { background-color: #020617; }
        .transition-hero { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
